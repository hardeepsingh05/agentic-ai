find_trending_companies:
  description: >
    Find the top trending companies in the news in {sector} as of {current_date} by searching the latest news from the web/internet. Find new companies that you've not found before.
    Use your available tools to do web search.
  expected_output: >
    A list of trending companies in {sector}.
  agent: trending_company_finder
  output_file: output/trending_companies.json

research_trending_companies:
  description: >
    Given a list of trending companies, provide detailed analysis of each company in a report by searching online on the web.
    You can use available web search tool.
  expected_output: >
    A report containing detailed analysis of each company
  agent: financial_researcher
  context: 
    - find_trending_companies
  output_file: output/research_report.json

pick_best_company:
  description: >
    Analyze the research findings and pick the best company for investment. Ensure research is up to date as of {current_date}.
    Send an email to the recipient with the decision and 1 sentence rationale, you can use available tool to do that.
    Then responsd with a detailed report on why you chose this company, and which companies were not selected.
  expected_output: >
    The chosen company and why it was chosen; the companies that were not selected and why they were not selected.
  agent: stock_picker
  context: 
    - research_trending_companies
  output_file: output/final_decision.md